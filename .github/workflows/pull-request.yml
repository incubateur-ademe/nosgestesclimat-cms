name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: './package.json'
          cache: 'pnpm'
      - name: 'Install packages'
        run: pnpm install

      - name: 'Lint'
        run: pnpm lint

      - name: 'Build'
        run: |
          cp .env.example .env
          pnpm build
